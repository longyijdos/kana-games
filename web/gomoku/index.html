<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋 · Kana</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="gomoku-layout">
    <section class="board-panel" aria-label="五子棋棋盘与操作">
      <header class="board-heading">
        <div><p class="eyebrow">十五路棋盘 · 无禁手</p><h1>五子棋</h1></div>
        <div class="header-tools"><span id="connection" class="connection" role="status">连接中</span>
          <button id="rulesToggle" class="quiet-btn" type="button">玩法说明</button></div>
      </header>
      <div class="match-toolbar">
        <label>先手 <select id="starterSelect" disabled><option value="player">你</option><option value="agent">Kana</option></select></label>
        <button id="startButton" class="start-btn" type="button" disabled>开始对局</button>
        <span id="turnBadge" class="turn-badge" role="status">等待开局</span>
      </div>
      <div class="seats">
        <div class="seat-card"><strong>你</strong><span id="playerNote" class="seat-note">执黑 · 先手</span><p id="playerSpeech" class="seat-speech"></p></div>
        <div class="seat-card"><strong>Kana</strong><span id="agentNote" class="seat-note">执白 · 后手</span><p id="agentSpeech" class="seat-speech"></p></div>
      </div>
      <div id="gameArea" class="game-area"></div>
      <div id="movePanel" hidden></div>
      <p id="actionFeedback" class="feedback" role="status"></p>
    </section>
    <aside class="chat-panel" aria-label="对局记录与聊天">
      <div class="chat-heading"><h2>对局记录</h2><p>一手棋，一句话。</p></div>
      <ol id="chatHistory" class="chat-history" aria-label="对局记录"></ol>
      <form id="chatForm" class="chat-form">
        <label for="talkInput">和 Kana 聊聊</label>
        <div class="composer"><input id="talkInput" placeholder="也可以随落子一起发送" autocomplete="off" disabled>
          <button id="sendButton" type="submit" disabled>发送</button></div>
        <p id="chatFeedback" class="feedback" role="status"></p>
      </form>
    </aside>
  </main>
  <footer>先手执黑 · 连成五子及以上获胜</footer>
  <dialog id="rulesModal" class="rules-dialog">
    <div class="rules-heading"><strong>五子棋 · 玩法说明</strong><button id="rulesCloseBtn" class="quiet-btn" aria-label="关闭" type="button">关闭</button></div>
    <div id="rulesContent" class="rules-content"></div>
    <button id="rulesConfirmBtn" class="start-btn" type="button">知道了</button>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
